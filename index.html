<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirect...</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0f17;
  font-family:Inter,sans-serif;
  color:#fff;
  overflow:hidden;
}

.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(0,255,170,0.15), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0,140,255,0.12), transparent 45%);
  filter: blur(40px);
}

.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:400px;
  background:rgba(18,24,38,0.75);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:22px;
  padding:34px 26px;
  text-align:center;
  backdrop-filter: blur(20px);
}

.logo{
  font-weight:600;
  font-size:18px;
  margin-bottom:26px;
}

h1{
  font-size:22px;
  margin-bottom:6px;
}

.sub{
  font-size:13px;
  color:rgba(255,255,255,0.55);
  margin-bottom:26px;
}

.btn{
  display:block;
  width:100%;
  padding:14px;
  border-radius:14px;
  font-size:14px;
  text-decoration:none;
  margin-bottom:10px;
  cursor:pointer;
  border:none;
  transition:.18s;
}

.primary{
  background:linear-gradient(135deg,#00e5a0,#00b8ff);
  color:#041018;
  font-weight:600;
}

.secondary{
  background:rgba(255,255,255,0.03);
  color:#fff;
  border:1px solid rgba(255,255,255,0.08);
}

.footer{
  margin-top:20px;
  font-size:11px;
  color:rgba(255,255,255,0.4);
}

.footer a{
  color:#00e5a0;
  text-decoration:none;
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="card">

<div class="logo">ARealNewCONNECT</div>

<h1>Подключение к VPN</h1>
<div class="sub">Выбери приложение или открой автоматически</div>

<button class="btn primary" id="auto">Открыть автоматически</button>
<button class="btn secondary" id="happ">Happ</button>
<button class="btn secondary" id="hiddify">Hiddify</button>
<button class="btn secondary" id="v2ray">V2RayTun</button>
<button class="btn secondary" id="copy">Скопировать ссылку</button>

<div class="footer">
made by <a href="">@thepaz</a>
</div>

</div>

<script>
const p=new URLSearchParams(location.search);
const t=p.get("token");

const sub=t?"https://sub.mynewconnectreal.lol/sub/"+t:null;

const urls={
  happ:sub?"happ://add/"+sub:null,
  hiddify:sub?"hiddify://import/"+sub:null,
  v2ray:sub?"v2raytun://import/"+sub:null
};

function openApp(url){
  if(!url) return;

  const iframe=document.createElement("iframe");
  iframe.style.display="none";
  iframe.src=url;
  document.body.appendChild(iframe);

  setTimeout(()=>{
    window.location.href=url;
  },500);
}

function smartOpen(){
  openApp(urls.happ);
  setTimeout(()=>openApp(urls.hiddify),1200);
  setTimeout(()=>openApp(urls.v2ray),2000);
}

auto.onclick=smartOpen;

happ.onclick=()=>openApp(urls.happ);
hiddify.onclick=()=>openApp(urls.hiddify);
v2ray.onclick=()=>openApp(urls.v2ray);

copy.onclick=()=>{
  if(!sub)return;
  navigator.clipboard.writeText(sub);
};
</script>

</body>
</html>
