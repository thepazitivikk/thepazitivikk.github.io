<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyNewConnect VPN</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #00e5a0;
  --accent2: #00b8ff;
  --bg: #070b12;
  --surface: #0f1623;
  --surface2: #151c2b;
  --border: rgba(255,255,255,0.06);
  --text: #f0f4ff;
  --muted: rgba(240,244,255,0.45);
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.15'/%3E%3C/svg%3E");
  pointer-events: none;
}

.bg-glow {
  position: fixed;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,229,160,0.08) 0%, transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.bg-glow2 {
  position: fixed;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,184,255,0.06) 0%, transparent 70%);
  top: 20%;
  right: 10%;
}

.card {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 440px;
  margin: 1.5rem;
  background: rgba(15,22,35,0.7);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 3rem 2.5rem;
  text-align: center;
  backdrop-filter: blur(20px);
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 2.2rem;
}

.logo-icon {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-icon svg {
  width: 22px;
  height: 22px;
  fill: #070b12;
}

.logo-text {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.2rem;
}

.logo-text span {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.shield {
  width: 80px;
  height: 80px;
  margin: 0 auto 1.5rem;
  background: linear-gradient(135deg, rgba(0,229,160,0.12), rgba(0,184,255,0.08));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

h1 {
  font-family: 'Syne', sans-serif;
  font-size: 1.5rem;
  margin-bottom: 0.6rem;
}

.subtitle {
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 2rem;
}

.btn {
  display: block;
  width: 100%;
  padding: 1rem;
  border-radius: 14px;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  text-decoration: none;
  margin-bottom: 0.6rem;
  transition: 0.2s;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #070b12;
}

.btn-primary:hover {
  transform: translateY(-2px);
}

.btn-secondary {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  color: var(--text);
  backdrop-filter: blur(10px);
}

.btn-secondary:hover {
  background: rgba(255,255,255,0.06);
}

.divider {
  margin: 1.2rem 0;
  font-size: 0.7rem;
  color: var(--muted);
}

#footer {
  margin-top: 2rem;
  font-size: 0.7rem;
  color: var(--muted);
}

#footer a {
  color: var(--accent);
  text-decoration: none;
}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow2"></div>

<div class="card">

<div class="logo">
  <div class="logo-icon">
    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.25 3.75 10.15 9 11.25C17.25 21.15 21 16.25 21 11V5l-9-4z"/></svg>
  </div>
  <div class="logo-text">A<span>Real</span>CONNECT</div>
</div>

<div class="shield">
<svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.75 10.15 9 11.25C18.25 22.15 20 17.25 20 12V6l-8-4z" stroke="#00e5a0" stroke-width="1.5" fill="none"/><path d="M9 12l2 2 4-4" stroke="#00e5a0" stroke-width="1.5"/></svg>
</div>

<h1>Подключиться к VPN</h1>
<p class="subtitle">Выбери приложение или открой автоматически</p>

<a class="btn btn-primary" id="auto">🚀 Открыть автоматически</a>
<a class="btn btn-secondary" id="happ">Happ</a>
<a class="btn btn-secondary" id="hiddify">Hiddify</a>
<a class="btn btn-secondary" id="copy">Скопировать ссылку</a>

<div class="divider">если не открылось — попробуй другое приложение</div>

<div id="footer">
made by <a href="https://t.me/thepazitivik">@thepazitivik</a>
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

const sub = token ? "https://sub.mynewconnectreal.lol/sub/" + token : null;

const urls = {
  happ: sub ? "happ://add/" + sub : null,
  hiddify: sub ? "hiddify://import/" + sub : null
};

function open(url){
  if(!url) return;
  window.location.href = url;
}

document.getElementById("auto").onclick = () => {
  open(urls.happ);
  setTimeout(()=>open(urls.hiddify),1200);
};

document.getElementById("happ").onclick = () => open(urls.happ);
document.getElementById("hiddify").onclick = () => open(urls.hiddify);

document.getElementById("copy").onclick = () => {
  if(!sub) return;
  navigator.clipboard.writeText(sub);
};
</script>

</body>
</html>
