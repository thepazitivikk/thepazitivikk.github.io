<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <title>GisConnect — Быстрое подключение</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f3f6fc;
      --muted: #8b98b1;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .logo-badge {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 22px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .tab {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 18px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.12s, background 0.2s;
      margin-bottom: 10px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14px;
      padding: 13px 16px;
    }

    .divider {
      height: 1px;
      background: var(--card-border);
      margin: 18px 0;
    }

    .step-hint {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .platforms {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .plat-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: var(--muted);
      font-size: 12px;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
    }

    .plat-btn.active {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.15);
    }

    .url-box {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.25);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
      user-select: all;
    }

    .error-msg {
      color: #f87171;
      font-size: 14px;
      margin: 16px 0;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo-badge" id="appBadge">⚡</div>
    <h1 id="titleText">Подключение GisConnect</h1>
    <p class="subtitle" id="subtitleText">
      Открываем приложение и добавляем вашу подписку автоматически…
    </p>

    <div id="errorBox" class="error-msg hidden">
      Ссылка подписки не передана. Вернитесь в Telegram-бот и нажмите кнопку подключения заново.
    </div>

    <div id="mainContent">
      <div class="tabs">
        <button type="button" class="tab active" id="tabIncy" data-app="incy">INCY</button>
        <button type="button" class="tab" id="tabHapp" data-app="happ">Happ</button>
      </div>

      <a id="openAppBtn" class="btn btn-primary" href="#">
        🚀 Добавить подписку в <span id="appNameBtn">INCY</span>
      </a>

      <button type="button" id="copyBtn" class="btn btn-secondary">
        📋 Скопировать ссылку подписки
      </button>

      <div class="divider"></div>

      <p class="step-hint">Ещё не установлено приложение?</p>
      <a id="downloadBtn" class="btn btn-secondary" href="#" target="_blank" rel="noopener">
        ⬇️ Скачать <span id="downloadAppName">INCY</span> (<span id="platformName">iPhone</span>)
      </a>

      <div class="platforms" id="platformPicker">
        <button type="button" class="plat-btn" data-plat="ios">iPhone / iPad</button>
        <button type="button" class="plat-btn" data-plat="android">Android</button>
        <button type="button" class="plat-btn" data-plat="windows">Windows</button>
        <button type="button" class="plat-btn" data-plat="macos">Mac</button>
      </div>

      <div class="url-box" id="rawUrlBox"></div>
    </div>
  </main>

  <script>
    const DEFAULT_SUB_HOST = 'https://sub.tgis.vu/';

    const APPS = {
      incy: {
        name: 'INCY',
        badge: 'I',
        deepLink: (url) => `incy://add/${url}`,
        downloads: {
          ios: 'https://apps.apple.com/ru/app/incy/id6756943388',
          android: 'https://play.google.com/store/apps/details?id=llc.itdev.incy',
          windows: 'https://github.com/INCY-DEV/incy-platforms/releases/download/latest/incy-windows-setup.exe',
          macos: 'https://apps.apple.com/ru/app/incy/id6756943388'
        }
      },
      happ: {
        name: 'Happ',
        badge: 'H',
        deepLink: (url) => `happ://add/${url}`,
        downloads: {
          ios: 'https://apps.apple.com/app/happ-proxy-utility/id6504287215',
          android: 'https://play.google.com/store/apps/details?id=com.happproxy',
          windows: 'https://github.com/Happ-proxy/happ-desktop/releases/latest/download/setup-Happ.x64.exe',
          macos: 'https://apps.apple.com/app/happ-proxy-utility/id6504287215'
        }
      }
    };

    const PLAT_LABELS = {
      ios: 'iPhone / iPad',
      android: 'Android',
      windows: 'Windows',
      macos: 'Mac'
    };

    function detectPlatform() {
      const ua = navigator.userAgent.toLowerCase();
      if (ua.includes('android')) return 'android';
      if (ua.includes('iphone') || ua.includes('ipad') || ua.includes('ipod')) return 'ios';
      if (ua.includes('mac')) return 'macos';
      return 'windows';
    }

    function normalizeSubUrl(raw) {
      if (!raw) return '';
      const trimmed = decodeURIComponent(raw.trim());
      if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
        return trimmed;
      }
      return DEFAULT_SUB_HOST + trimmed.replace(/^\/+/, '');
    }

    function parseInput() {
      const search = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.replace(/^#\/?/, ''));
      const getParam = (key) => search.get(key) || hash.get(key);

      let app = (getParam('app') || getParam('client') || '').toLowerCase();
      let sub = getParam('sub') || getParam('url') || getParam('key') || getParam('token') || '';

      // Поддержка коротких параметров ?incy=КЛЮЧ или ?happ=КЛЮЧ
      if (!sub && getParam('incy')) {
        app = 'incy';
        sub = getParam('incy');
      } else if (!sub && getParam('happ')) {
        app = 'happ';
        sub = getParam('happ');
      }

      if (app !== 'incy' && app !== 'happ') {
        app = 'incy';
      }

      return {
        app,
        hasExplicitApp: Boolean(
          getParam('app') || getParam('client') || getParam('incy') || getParam('happ')
        ),
        subUrl: normalizeSubUrl(sub)
      };
    }

    const state = {
      ...parseInput(),
      platform: detectPlatform()
    };

    function render() {
      if (!state.subUrl) {
        document.getElementById('errorBox').classList.remove('hidden');
        document.getElementById('mainContent').classList.add('hidden');
        return;
      }

      const appCfg = APPS[state.app];
      const deepLinkUrl = appCfg.deepLink(state.subUrl);

      document.getElementById('appBadge').textContent = appCfg.badge;
      document.getElementById('appNameBtn').textContent = appCfg.name;
      document.getElementById('downloadAppName').textContent = appCfg.name;
      document.getElementById('platformName').textContent = PLAT_LABELS[state.platform];
      document.getElementById('openAppBtn').href = deepLinkUrl;
      document.getElementById('downloadBtn').href = appCfg.downloads[state.platform];
      document.getElementById('rawUrlBox').textContent = state.subUrl;

      document.getElementById('tabIncy').classList.toggle('active', state.app === 'incy');
      document.getElementById('tabHapp').classList.toggle('active', state.app === 'happ');

      document.querySelectorAll('#platformPicker .plat-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.plat === state.platform);
      });
    }

    document.getElementById('tabIncy').addEventListener('click', () => {
      state.app = 'incy';
      render();
    });

    document.getElementById('tabHapp').addEventListener('click', () => {
      state.app = 'happ';
      render();
    });

    document.getElementById('platformPicker').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-plat]');
      if (!btn) return;
      state.platform = btn.dataset.plat;
      render();
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const btn = document.getElementById('copyBtn');
      try {
        await navigator.clipboard.writeText(state.subUrl);
        btn.textContent = '✅ Ссылка скопирована!';
        setTimeout(() => {
          btn.textContent = '📋 Скопировать ссылку подписки';
        }, 2000);
      } catch (_) {
        prompt('Скопируйте ссылку:', state.subUrl);
      }
    });

    render();

    // Автоматический запуск приложения при открытии ссылки
    if (state.subUrl && state.hasExplicitApp) {
      setTimeout(() => {
        window.location.href = APPS[state.app].deepLink(state.subUrl);
      }, 150);
    }
  </script>
</body>
</html>
