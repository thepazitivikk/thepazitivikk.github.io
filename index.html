<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата подтверждена</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f4f6fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 1.5rem;
        }

        .card {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 2.5rem;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 30, 0.12);
            transition: transform 0.2s ease;
            text-align: center;
        }

        .graphic {
            font-size: 8rem;
            line-height: 1;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.2rem;
            letter-spacing: 0.1em;
            color: #0b1e2b;
            opacity: 0.9;
            user-select: none;
        }

        .check-mark {
            display: inline-block;
            width: 7rem;
            height: 7rem;
            background: #e6f0f5;
            border-radius: 50%;
            position: relative;
            margin: 0 auto 1.8rem auto;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
        }

        .check-mark::after {
            content: "✔";
            font-size: 4.8rem;
            font-weight: 300;
            color: #1d4a5e;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.9;
        }

        .title {
            font-size: 3rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            color: #0b1e2b;
            margin-bottom: 0.5rem;
            line-height: 1.1;
        }

        .sub {
            font-size: 1.3rem;
            font-weight: 300;
            color: #375b6b;
            margin-bottom: 2.8rem;
            letter-spacing: 0.01em;
            border-bottom: 1px solid #eef4f8;
            padding-bottom: 1.8rem;
        }

        .btn {
            display: inline-block;
            background: #0b1e2b;
            color: white;
            font-weight: 400;
            font-size: 1.2rem;
            padding: 1rem 3.2rem;
            border-radius: 60px;
            text-decoration: none;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
            border: 1px solid #0b1e2b;
            box-shadow: 0 4px 10px rgba(11, 30, 43, 0.05);
        }

        .btn:hover {
            background: #1d3d4f;
            border-color: #1d3d4f;
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(11, 30, 43, 0.12);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .footnote {
            margin-top: 2.2rem;
            font-size: 0.9rem;
            color: #6f8b9b;
            font-weight: 300;
            letter-spacing: 0.3px;
            opacity: 0.7;
        }

        @media (max-width: 500px) {
            .card {
                padding: 2rem 1.5rem;
            }
            .title {
                font-size: 2.4rem;
            }
            .graphic {
                font-size: 5.5rem;
            }
            .check-mark {
                width: 5.5rem;
                height: 5.5rem;
            }
            .check-mark::after {
                font-size: 3.6rem;
            }
            .btn {
                padding: 0.8rem 2.4rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="graphic">
            <span>⏤</span>
            <span>⏤</span>
            <span>⏤</span>
        </div>

        <div class="check-mark"></div>

        <h1 class="title">Вы оплатили.</h1>

        <div class="sub">Вернитесь на сервер</div>

        <a href="#" class="btn">Спасибо, хорошо!</a>

        <div class="footnote">· не несет юридической силы ·</div>
    </div>
</body>
</html>
