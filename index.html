<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyNewConnect</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#0b0f17,#121828);
  color:#fff;
}

.card{
  width:100%;
  max-width:400px;
  background:rgba(20,28,45,0.9);
  border-radius:24px;
  padding:32px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h1{
  font-size:24px;
  margin-bottom:8px;
  font-weight:600;
}

.sub{
  font-size:13px;
  color:rgba(255,255,255,0.55);
  margin-bottom:24px;
}

.btn{
  display:block;
  width:100%;
  padding:14px;
  border-radius:14px;
  font-size:14px;
  font-weight:500;
  margin-bottom:12px;
  cursor:pointer;
  border:none;
  transition:.18s;
}

.primary{
  background:linear-gradient(135deg,#00e5a0,#00b8ff);
  color:#041018;
  font-weight:600;
  box-shadow:0 4px 16px rgba(0,229,160,0.25);
}

.primary:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,229,160,0.35);
}

.secondary{
  background:rgba(255,255,255,0.08);
  color:#fff;
  border:1px solid rgba(255,255,255,0.12);
}

.secondary:hover{
  background:rgba(255,255,255,0.12);
}

.section{
  margin-top:20px;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,0.08);
}

.section-title{
  font-size:12px;
  color:rgba(255,255,255,0.45);
  margin-bottom:10px;
}

.notify{
  margin-top:10px;
  font-size:12px;
  color:#00e5a0;
  min-height:18px;
}

.footer{
  margin-top:16px;
  font-size:10px;
  color:rgba(255,255,255,0.45);
}

.footer a{
  color:#00e5a0;
  text-decoration:none;
}
</style>
</head>
<body>

<div class="card">

<h1>Подключение к VPN</h1>
<div class="sub">Happ — основной клиент. Остальные опционально.</div>

<button class="btn primary" id="auto">Открыть Happ автоматически</button>
<button class="btn secondary" id="happ">Открыть Happ</button>
<button class="btn secondary" id="hiddify">Hiddify</button>
<button class="btn secondary" id="v2ray">V2RayTun</button>
<button class="btn secondary" id="copy">Скопировать ссылку</button>

<div id="notify" class="notify"></div>

<div class="section">
  <div class="section-title">Скачать приложения</div>
  <a class="btn primary" href="https://play.google.com/store/apps/details?id=org.happ.wine">Happ (Android)</a>
  <a class="btn primary" href="https://apps.apple.com/us/app/happ-wine/id1534503730">Happ (iOS)</a>
  <a class="btn secondary" href="https://play.google.com/store/apps/details?id=app.hiddify.com">Hiddify (Android)</a>
  <a class="btn secondary" href="https://github.com/hiddify/hiddify-app/releases/latest">Hiddify APK</a>
  <a class="btn secondary" href="https://apps.apple.com/us/app/hiddify-proxy-vpn/id6596777532">Hiddify (iOS)</a>
</div>

<div class="footer">
made by <a href="#">@thepaz</a>
</div>

</div>

<script>
const p=new URLSearchParams(location.search);
const t=p.get("token");
const sub=t?"https://sub.mynewconnectreal.lol/sub/"+t:null;

const urls={
  happ:sub?"happ://add/"+sub:null,
  hiddify:sub?"hiddify://import/"+sub:null,
  v2ray:sub?"v2raytun://import/"+sub:null
};

function show(text){
  const n=document.getElementById("notify");
  n.textContent=text;
  setTimeout(()=>{if(n.textContent===text)n.textContent=""},2000);
}

function openApp(url){
  if(!url){show("Ошибка ссылки");return;}
  show("Открытие приложения...");
  const iframe=document.createElement("iframe");
  iframe.style.display="none";
  iframe.src=url;
  document.body.appendChild(iframe);
  setTimeout(()=>{window.location.href=url},800);
}

auto.onclick=()=>{
  openApp(urls.happ);
  setTimeout(()=>openApp(urls.hiddify),1200);
  setTimeout(()=>openApp(urls.v2ray),2000);
};

happ.onclick=()=>openApp(urls.happ);
hiddify.onclick=()=>openApp(urls.hiddify);
v2ray.onclick=()=>openApp(urls.v2ray);

copy.onclick=()=>{
  if(!sub){show("Нет ссылки");return;}
  navigator.clipboard.writeText(sub).then(()=>show("Скопировано!"));
};
</script>

</body>
</html>
